<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schach">
<meta name="theme-color" content="#EAF3E6">
<title>Schach-Abenteuer</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#EAF3E6;--paper:#fff;--ink:#1D2B53;--muted:#5F6B85;--line:#CCD8C4;
  --light:#F3E6C8;--dark:#B58863;--sel:#F7D046;--last:rgb(155 199 0 / .45);--hint:#4C9BE8;
  --good:#2E9E5B;--bad:#D9443B;--sun:#FFC93C;
  --piece-font:"Apple Symbols","Segoe UI Symbol","Noto Sans Symbols2","Noto Sans Symbols","DejaVu Sans",serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:16px 0 24px}
header{display:flex;align-items:center;gap:10px;min-height:52px}
header h1{flex:1;margin:0;font-size:24px}
.back{width:48px;height:48px;border-radius:24px;background:var(--paper);box-shadow:0 3px 0 var(--line);font-size:24px;font-weight:700}
.stars{font-weight:700;font-size:20px;background:var(--paper);border-radius:20px;padding:6px 14px;box-shadow:0 3px 0 var(--line)}
.stars::before{content:"★ ";color:#E8A800}
/* Startseite */
.hero{text-align:center;margin:8px 0 18px}
.hero .big{font-size:64px;line-height:1;font-family:var(--piece-font)}
.hero p{margin:6px 0 0;color:var(--muted)}
.kap{display:flex;align-items:center;gap:14px;width:100%;background:var(--paper);border-radius:22px;padding:14px 16px;margin-bottom:14px;box-shadow:0 4px 0 var(--line);text-align:left}
.kap .ic{font-size:40px;width:52px;text-align:center;font-family:var(--piece-font),system-ui}
.kap b{display:block;font-size:20px}
.kap small{color:var(--muted);font-size:15px}
.kap .pr{margin-left:auto;font-weight:700;color:var(--muted);white-space:nowrap}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:var(--paper);border-radius:18px;padding:14px;box-shadow:0 4px 0 var(--line);text-align:left;min-height:96px;display:flex;flex-direction:column;gap:6px}
.item b{font-size:17px}
.item .st{color:#E8A800;font-size:20px;letter-spacing:2px;margin-top:auto}
.item .st i{color:var(--line);font-style:normal}
/* Aufgabe */
.task{background:var(--paper);border-radius:20px;padding:12px 14px;box-shadow:0 3px 0 var(--line);margin-bottom:12px}
.task h2{margin:0 0 4px;font-size:20px}
.task p{margin:0;color:var(--muted)}
.turn{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:700}
.turn .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink)}
.board{position:relative;width:min(100%,calc(100dvh - 370px));min-width:280px;margin:0 auto;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));
  border-radius:12px;overflow:hidden;box-shadow:0 5px 0 rgb(29 43 83 / .25);touch-action:none}
.sq{position:relative;display:flex;align-items:center;justify-content:center;padding:0;border-radius:0;min-width:0;min-height:0;overflow:hidden}
.board{container-type:inline-size}
.sq .p{font-size:11cqi!important}
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq.last::after,.sq.selp::after{content:"";position:absolute;inset:0;pointer-events:none}
.sq.last::after{background:var(--last)}
.sq.selp::after{background:rgb(247 208 70 / .75)}
.sq.chk{background:radial-gradient(circle,#ff5b4f 0%,#e0302a 35%,transparent 75%),var(--light)}
.sq.d.chk{background:radial-gradient(circle,#ff5b4f 0%,#e0302a 35%,transparent 75%),var(--dark)}
.sq .p{position:relative;z-index:1;font-family:var(--piece-font);font-size:min(10vw,58px);line-height:1;transition:transform .15s}
.sq .p.w{color:#fff;-webkit-text-stroke:1.4px #1D2B53;paint-order:stroke fill;text-shadow:0 2px 0 rgb(0 0 0 / .25)}
.sq .p.b{color:#1D2B53;text-shadow:0 2px 0 rgb(0 0 0 / .2)}
.sq.selp .p{transform:scale(1.15)}
.sq.tgt::before{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgb(29 43 83 / .28);z-index:2;pointer-events:none}
.sq.tgt.cap::before{width:88%;height:88%;background:transparent;border:5px solid rgb(29 43 83 / .3)}
.sq.hint::after{content:"";position:absolute;inset:3px;border:4px solid var(--hint);border-radius:8px;pointer-events:none;animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.35}}
.co{position:absolute;font-size:11px;font-weight:700;opacity:.7;pointer-events:none;z-index:1}
.co.f{right:3px;bottom:1px}.co.r{left:3px;top:1px}
.sq.l .co{color:var(--dark)}.sq.d .co{color:var(--light)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.msg{text-align:center;min-height:2.6em;margin:10px 0 6px;font-size:19px;font-weight:700}
.msg.good{color:var(--good)}.msg.bad{color:var(--bad)}
.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{height:52px;padding:0 18px;border-radius:26px;background:var(--paper);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:17px}
.btn.main{background:var(--good);color:#fff;box-shadow:0 4px 0 #1f7a43;font-size:19px;padding:0 26px}
.btn.glow{animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 3px 0 var(--line),0 0 0 6px rgb(76 155 232 / .45)}}
/* Erfolg */
.win{position:fixed;inset:0;z-index:20;background:rgb(29 43 83 / .45);display:flex;align-items:center;justify-content:center;padding:16px}
.win .card{background:var(--paper);border-radius:28px;padding:26px 22px;text-align:center;width:min(100%,380px);box-shadow:0 8px 0 rgb(0 0 0 / .15);animation:pop .35s}
.win .big{font-size:44px;color:#E8A800;letter-spacing:6px}
.win h2{margin:6px 0;font-size:26px}
.win p{color:var(--muted);margin:0 0 18px}
.win .tools{flex-direction:column}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.foot{margin-top:28px;color:var(--muted);font-size:13px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.arrow{position:absolute;inset:0;pointer-events:none;z-index:3}
.ghost{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-60%) scale(1.25);font-family:var(--piece-font);line-height:1}
.ghost.w{color:#fff;-webkit-text-stroke:1.4px #1D2B53;paint-order:stroke fill}
.ghost.b{color:#1D2B53}
.sq.from .p{opacity:.35}
.sq.hint2::after{content:"";position:absolute;inset:3px;border:4px dashed var(--hint);border-radius:50%;pointer-events:none;animation:pulse 1s infinite alternate}
.kap.ai{background:linear-gradient(135deg,#FFF6D8,#fff);border:3px solid var(--sun)}
.setup{background:var(--paper);border-radius:22px;padding:16px;box-shadow:0 4px 0 var(--line);margin-bottom:14px}
.setup h3{margin:0 0 10px;font-size:18px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.seg button{flex:1;min-width:90px;height:54px;border-radius:18px;background:var(--bg);font-weight:700;font-size:17px;border:3px solid transparent}
.seg button[aria-pressed="true"]{border-color:var(--good);background:#E3F5EA}
.moves{font-size:14px;color:var(--muted);text-align:center;min-height:1.4em;margin-top:6px;word-break:break-word}
</style>
</head>
<body>
<div class="wrap">
  <!-- Startseite -->
  <div id="vHome">
    <header><h1>Schach-Abenteuer</h1><span class="stars" id="starsHome">0</span></header>
    <div class="hero"><div class="big">♞︎♛︎♚︎</div><p>Löse berühmte Schach-Rätsel aus Büchern und großen Partien – oder spiel gegen den Computer!</p></div>
    <button class="kap ai" id="goAI"><span class="ic">🤖</span><span><b>Gegen den Computer</b><small>Eine ganze Partie spielen</small></span></button>
    <div id="kapList"></div>
    <div class="tools"><button class="btn" id="voiceBtn" hidden>🗣️ Stimme</button></div>
    <div class="foot">Schachregeln: chess.js (BSD-Lizenz)</div>
  </div>
  <!-- Kapitel -->
  <div id="vKap" hidden>
    <header><button class="back" id="kapBack" aria-label="Zurück">‹</button><h1 id="kapTitle"></h1><span class="stars" id="starsKap">0</span></header>
    <div class="list" id="itemList"></div>
  </div>
  <!-- Computer-Partie einrichten -->
  <div id="vSetup" hidden>
    <header><button class="back" id="setupBack" aria-label="Zurück">‹</button><h1>Gegen den Computer</h1></header>
    <div class="setup">
      <h3>Wie stark soll der Computer sein?</h3>
      <div class="seg" id="segLevel"><button data-v="1">🐣 Leicht</button><button data-v="2">🦊 Mittel</button><button data-v="3">🦁 Stark</button></div>
      <h3>Welche Farbe willst du?</h3>
      <div class="seg" id="segColor"><button data-v="w">♔︎ Weiß</button><button data-v="b">♚︎ Schwarz</button><button data-v="r">🎲 Zufall</button></div>
      <button class="btn main" id="aiStart" style="width:100%">Los geht's! ›</button>
    </div>
    <button class="btn" id="aiResume" hidden style="width:100%">↩︎ Letzte Partie weiterspielen</button>
  </div>
  <!-- Brett (Rätsel und Computer-Partie) -->
  <div id="vPlay" hidden>
    <header><button class="back" id="playBack" aria-label="Zurück">‹</button><h1 id="playNum"></h1><span class="stars" id="starsPlay">0</span></header>
    <div class="task">
      <h2 id="tTitle"></h2><p id="tText"></p>
      <div class="turn"><span class="dot" id="tDot"></span><span id="tTurn"></span></div>
    </div>
    <div class="board" id="board" role="grid" aria-label="Schachbrett"></div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <div class="tools" id="puzzleTools">
      <button class="btn" id="bSpeak">🔊 Vorlesen</button>
      <button class="btn" id="bHint">💡 Tipp</button>
      <button class="btn" id="bReset">↺ Neu</button>
    </div>
    <div class="tools" id="aiTools" hidden>
      <button class="btn" id="aUndo">↶ Zug zurück</button>
      <button class="btn" id="aHint">💡 Tipp</button>
      <button class="btn" id="aNew">↺ Neue Partie</button>
    </div>
    <div class="moves" id="moveList"></div>
  </div>
</div>
<div class="win" id="win" hidden>
  <div class="card">
    <div class="big" id="winStars">★★★</div>
    <h2 id="winTitle">Schachmatt!</h2>
    <p id="winText"></p>
    <div class="tools"><button class="btn main" id="winNext">Nächstes Rätsel ›</button><button class="btn" id="winList">Zur Übersicht</button></div>
  </div>
</div>

<script type="module">
import { Chess } from './vendor/chess.js';
import { KAPITEL, AUFGABEN } from './puzzles.js';
import { bestMove } from './engine.js';

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('schach.' + k); return v === null ? d : JSON.parse(v) } catch (e) { return d } },
  set(k, v) { try { localStorage.setItem('schach.' + k, JSON.stringify(v)) } catch (e) {} },
};
let best = store.get('best', {});
const total = () => Object.values(best).reduce((a, b) => a + b, 0);
function showStars() { ['starsHome', 'starsKap', 'starsPlay'].forEach(id => $(id).textContent = total()) }

// ---------- Vorlesen ----------
let voice = null, voices = [];
function pickVoice() {
  voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith('de'));
  const want = store.get('voice', null);
  voice = voices.find(v => v.name === want) || voices.find(v => /Anna|Petra|Helena|Google/.test(v.name)) || voices[0] || null;
  const b = $('voiceBtn'); if (b) { b.hidden = voices.length < 2; b.textContent = '🗣️ Stimme: ' + (voice ? voice.name.replace(/\s*\(.*\)/, '') : '–') }
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice }
function nextVoice() {
  if (!voices.length) return;
  const i = voices.indexOf(voice); voice = voices[(i + 1) % voices.length]; store.set('voice', voice.name); pickVoice();
  say('Hallo! So klinge ich.');
}
function say(text) {
  if (!('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(text); u.lang = 'de-DE'; if (voice) u.voice = voice; u.rate = .95;
    // Safari verschluckt manchmal einen Satz, der direkt nach cancel() kommt
    if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(() => speechSynthesis.speak(u), 80) }
    else speechSynthesis.speak(u);
  } catch (e) {}
}
// iPhone/iPad: Ton erst nach dem ersten Loslassen des Fingers freischalten
let speechReady = false;
function unlockSpeech() {
  if (speechReady || !('speechSynthesis' in window)) return; speechReady = true;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u) } catch (e) {}
}
['pointerup', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, unlockSpeech, { capture: true }));
function hush() { try { speechSynthesis.cancel() } catch (e) {} }

// ---------- Figuren ----------
const GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
const NAME = { k: 'König', q: 'Dame', r: 'Turm', b: 'Läufer', n: 'Springer', p: 'Bauer' };
const DEN = { k: 'den König', q: 'die Dame', r: 'den Turm', b: 'den Läufer', n: 'den Springer', p: 'den Bauern' };
const FILES = 'abcdefgh';
const clean = s => s.replace(/[+#!?]/g, '');

// ---------- Ansichten ----------
function view(v) { ['vHome', 'vKap', 'vSetup', 'vPlay'].forEach(id => $(id).hidden = id !== v); window.scrollTo(0, 0); showStars() }
function kapItems(kid) { return AUFGABEN.map((a, i) => ({ a, i })).filter(x => x.a.k === kid) }
function starHTML(n) { return '★'.repeat(n) + '<i>' + '★'.repeat(3 - n) + '</i>' }

function renderHome() {
  mode = null; $('kapList').innerHTML = '';
  KAPITEL.forEach(k => {
    const items = kapItems(k.id), done = items.filter(x => best[x.i]).length;
    if (!items.length) return;
    const b = document.createElement('button'); b.className = 'kap';
    b.innerHTML = `<span class="ic">${k.icon}</span><span><b>${k.name}</b><small>${items.length} Rätsel</small></span><span class="pr">${done} / ${items.length} ✓</span>`;
    b.onclick = () => openKap(k.id); $('kapList').appendChild(b);
  });
  view('vHome');
}
let curKap = null;
function openKap(kid) {
  mode = null; curKap = kid; const k = KAPITEL.find(x => x.id === kid);
  $('kapTitle').textContent = k.name; $('itemList').innerHTML = '';
  kapItems(kid).forEach(({ a, i }, n) => {
    const b = document.createElement('button'); b.className = 'item';
    b.innerHTML = `<small>Rätsel ${n + 1}</small><b>${a.titel}</b><span class="st">${starHTML(best[i] || 0)}</span>`;
    b.onclick = () => openPuzzle(i); $('itemList').appendChild(b);
  });
  view('vKap');
}
$('kapBack').onclick = renderHome;
$('setupBack').onclick = renderHome;
$('playBack').onclick = () => { hush(); if (mode === 'ai') { saveAI(); openSetup() } else openKap(curKap || AUFGABEN[cur].k) };

// ---------- gemeinsamer Brett-Zustand ----------
let mode = null;          // 'puzzle' | 'ai'
let game, me, sel = null, busy = false, lastMove = null, over = false;
let hint = null;          // {from, to, lvl}

function renderBoard() {
  const B = $('board'); B.innerHTML = '';
  const flip = me === 'b', tg = sel ? game.moves({ square: sel, verbose: true }) : [];
  const kingChk = game.inCheck() ? findKing(game.turn()) : null;
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const file = flip ? 7 - f : f, rank = flip ? r + 1 : 8 - r, sq = FILES[file] + rank;
    const d = document.createElement('button'); d.className = 'sq ' + ((file + rank) % 2 ? 'l' : 'd'); d.dataset.sq = sq;
    const p = game.get(sq);
    if (p) { const s = document.createElement('span'); s.className = 'p ' + p.color; s.textContent = GLYPH[p.type] + '︎'; d.appendChild(s) }
    d.setAttribute('aria-label', sq + (p ? ' ' + (p.color === 'w' ? 'weißer ' : 'schwarzer ') + NAME[p.type] : ''));
    if (lastMove && lastMove.includes(sq)) d.classList.add('last');
    if (sq === sel) d.classList.add('selp');
    if (sq === kingChk) d.classList.add('chk');
    if (hint && hint.lvl >= 2 && sq === hint.from) d.classList.add('hint');
    if (hint && hint.lvl >= 3 && sq === hint.to) d.classList.add('hint2');
    const t = tg.find(m => m.to === sq); if (t) { d.classList.add('tgt'); if (t.captured) d.classList.add('cap') }
    if (r === 7) d.insertAdjacentHTML('beforeend', `<span class="co f">${FILES[file]}</span>`);
    if (f === 0) d.insertAdjacentHTML('beforeend', `<span class="co r">${rank}</span>`);
    d.onclick = e => { if (e.detail === 0) tap(sq) };   // Tastatur
    B.appendChild(d);
  }
  if (hint && hint.lvl >= 3) drawArrow(hint.from, hint.to);
}
function sqCenter(sq) {
  const flip = me === 'b', f = FILES.indexOf(sq[0]), r = +sq[1];
  const x = flip ? 7 - f : f, y = flip ? r - 1 : 8 - r;
  return [(x + .5) * 12.5, (y + .5) * 12.5];
}
function drawArrow(a, b) {
  const [x1, y1] = sqCenter(a), [x2, y2] = sqCenter(b);
  const len = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / len, uy = (y2 - y1) / len;
  const ex = x2 - ux * 4, ey = y2 - uy * 4;
  $('board').insertAdjacentHTML('beforeend', `<svg class="arrow" viewBox="0 0 100 100" aria-hidden="true">
    <defs><marker id="ah" markerWidth="4" markerHeight="4" refX="2" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 z" fill="#4C9BE8"/></marker></defs>
    <line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="#4C9BE8" stroke-opacity=".85" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ah)"/></svg>`);
}
function findKing(c) { for (const row of game.board()) for (const p of row) if (p && p.type === 'k' && p.color === c) return p.square; return null }
function canPlay() { return !busy && !over && game.turn() === me }

function tap(sq) {
  if (!canPlay()) return;
  const p = game.get(sq);
  if (sel && sel !== sq) {
    const mv = game.moves({ square: sel, verbose: true }).find(m => m.to === sq);
    if (mv) { onMove(mv); return }
  }
  if (p && p.color === me) { sel = sel === sq ? null : sq; renderBoard(); return }
  if (sel) { sel = null; renderBoard() }
}

// ---------- Ziehen mit dem Finger ----------
let drag = null;
const sqAt = (x, y) => { const el = document.elementFromPoint(x, y); const s = el && el.closest('.sq'); return s && $('board').contains(s) ? s.dataset.sq : null };
$('board').addEventListener('pointerdown', e => {
  const sq = sqAt(e.clientX, e.clientY); if (!sq || !canPlay()) return;
  const p = game.get(sq);
  // Leeres/gegnerisches Feld: erst beim Loslassen ziehen (sonst blockiert Safari den Ton)
  if (!(p && p.color === me)) { drag = { tapOnly: sq, id: e.pointerId }; return }
  const wasSel = sel === sq; sel = sq; renderBoard();
  drag = { from: sq, x: e.clientX, y: e.clientY, moved: false, wasSel, ghost: null, id: e.pointerId };
  try { $('board').setPointerCapture(e.pointerId) } catch (er) {}
  e.preventDefault();
});
$('board').addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || drag.tapOnly) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
  if (!drag.moved) {
    drag.moved = true; const p = game.get(drag.from);
    const g = document.createElement('div'); g.className = 'ghost ' + p.color; g.textContent = GLYPH[p.type] + '︎';
    g.style.fontSize = ($('board').getBoundingClientRect().width / 8 * .8) + 'px'; document.body.appendChild(g); drag.ghost = g;
    document.querySelector(`[data-sq="${drag.from}"]`)?.classList.add('from');
  }
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (d.tapOnly) { if (sqAt(e.clientX, e.clientY) === d.tapOnly) tap(d.tapOnly); return }
  d.ghost?.remove();
  if (!d.moved) { if (d.wasSel) { sel = null; renderBoard() } return }
  const to = sqAt(e.clientX, e.clientY);
  const mv = to && game.moves({ square: d.from, verbose: true }).find(m => m.to === to);
  if (mv) onMove(mv); else renderBoard();
}
$('board').addEventListener('pointerup', endDrag);
$('board').addEventListener('pointercancel', e => { if (drag) { drag.ghost?.remove(); drag = null; renderBoard() } });

function onMove(mv) { if (mode === 'ai') aiPlayerMove(mv); else tryMove(mv) }
function setMsg(t, cls) { const m = $('msg'); m.textContent = t; m.className = 'msg ' + (cls || '') }

// ---------- Rätsel ----------
let cur = 0, step = 0, fails = 0, hints = 0;
function startPos(a) { const c = new Chess(); if (a.start) c.load(a.start); else a.vor.forEach(m => c.move(m)); return c }
function lastOf(a) { if (a.start) return null; const c = new Chess(); let m; a.vor.forEach(x => m = c.move(x)); return m ? [m.from, m.to] : null }

function openPuzzle(i) {
  mode = 'puzzle'; cur = i; curKap = AUFGABEN[i].k; const a = AUFGABEN[i];
  game = startPos(a); me = game.turn(); step = 0; sel = null; busy = false; fails = 0; hints = 0; over = false; hint = null;
  lastMove = lastOf(a);
  const n = kapItems(a.k).findIndex(x => x.i === i) + 1;
  $('playNum').textContent = 'Rätsel ' + n + ' von ' + kapItems(a.k).length;
  $('tTitle').textContent = a.titel; $('tText').textContent = a.text; $('tText').hidden = false;
  $('tDot').style.background = me === 'w' ? '#fff' : '#1D2B53';
  $('puzzleTools').hidden = false; $('aiTools').hidden = true; $('moveList').textContent = '';
  setTurnText(); setMsg('', ''); $('bHint').classList.remove('glow');
  renderBoard(); view('vPlay');
}
function myMoves() { return Math.ceil(AUFGABEN[cur].loesung.length / 2) }
function setTurnText() {
  const a = AUFGABEN[cur], farbe = me === 'w' ? 'Weiß' : 'Schwarz', nr = step / 2 + 1, n = myMoves();
  const ziel = a.ziel === 'matt' ? (n === 1 ? 'Setze matt in 1 Zug!' : `Setze matt in ${n} Zügen!`) : (n === 1 ? 'Finde den besten Zug!' : 'Finde die beste Zugfolge!');
  $('tTurn').textContent = `Du spielst ${farbe}. ${ziel}` + (n > 1 ? ` (Zug ${Math.min(nr, n)} von ${n})` : '');
}
// Tipp-Stufen: 1 = nur Worte, 2 = Figur leuchtet, 3 = Zielfeld + Pfeil + genaue Ansage
// Von selbst kommt Hilfe erst nach vielen falschen Zügen.
const AUTO_HILFE = 30;
function solutionMove() { const c = new Chess(game.fen()); return c.move(AUFGABEN[cur].loesung[step]) }
function showHint(lvl, quiet) {
  const a = AUFGABEN[cur], m = solutionMove();
  if (!hint || hint.lvl < lvl) hint = { from: m.from, to: m.to, lvl };
  sel = null; renderBoard();
  if (hint.lvl === 1) { setMsg('💡 ' + a.tipp, ''); say(a.tipp) }
  else if (hint.lvl === 2) { const t = `Nimm ${DEN[m.piece]}! Wohin soll die Figur ziehen?`; setMsg('💡 ' + t, ''); say(t) }
  else {
    const t = `Zieh ${DEN[m.piece]} von ${m.from} nach ${m.to}.`;
    setMsg((quiet ? 'Nein. ' : '') + '👉 ' + t + ' Folge dem blauen Pfeil!', ''); if (!quiet) say(t);
  }
}
$('bHint').onclick = () => {
  if (over || busy || mode !== 'puzzle') return;
  hints++; $('bHint').classList.remove('glow');
  showHint(hint ? Math.min(hint.lvl + 1, 3) : 1);
};

function tryMove(mv) {
  const a = AUFGABEN[cur], want = a.loesung[step];
  const res = game.move({ from: mv.from, to: mv.to, promotion: 'q' });
  const ok = clean(res.san) === clean(want) || (a.ziel === 'matt' && game.isCheckmate());
  if (!ok) {
    game.undo(); fails++; sel = null; renderBoard();
    document.querySelector(`[data-sq="${mv.to}"]`)?.classList.add('shake');
    say('Nein.');
    if (fails >= AUTO_HILFE) { showHint(3, true); return }
    setMsg('Nein. Probier nochmal!', 'bad');
    return;
  }
  sel = null; hint = null; lastMove = [res.from, res.to]; step++; renderBoard();
  if (game.isCheckmate() || step >= a.loesung.length) { finish(); return }
  setMsg(res.san.includes('+') ? 'Schach! Super Zug! 👍' : 'Super Zug! 👍', 'good');
  say(res.san.includes('+') ? 'Schach! Super Zug!' : 'Super Zug!');
  busy = true;
  setTimeout(() => {
    if (mode !== 'puzzle') return;
    const r = game.move(a.loesung[step]); step++; lastMove = [r.from, r.to]; busy = false;
    setTurnText(); setMsg('Jetzt du!', ''); renderBoard();
  }, 900);
}

function finish() {
  over = true; const a = AUFGABEN[cur];
  const stars = fails === 0 && hints === 0 ? 3 : fails + hints <= 3 ? 2 : 1;
  if ((best[cur] || 0) < stars) { best[cur] = stars; store.set('best', best) }
  showStars();
  const matt = game.isCheckmate();
  const text = a.ende || (matt ? 'Du hast den König gefangen.' : 'Du hast eine Figur gewonnen.');
  $('winStars').innerHTML = starHTML(stars);
  $('winTitle').textContent = matt ? 'Schachmatt! 🎉' : 'Geschafft! 🎉';
  $('winText').textContent = text;
  setMsg(matt ? 'Schachmatt!' : 'Geschafft!', 'good');
  say((matt ? 'Schachmatt! ' : 'Geschafft! ') + text);
  const next = AUFGABEN.findIndex((x, i) => i > cur && x.k === a.k);
  $('winNext').hidden = next < 0; $('winNext').dataset.next = next;
  setTimeout(() => { if (over && mode === 'puzzle' && !$('vPlay').hidden) $('win').hidden = false }, 900);
}
$('winNext').onclick = () => { $('win').hidden = true; openPuzzle(+$('winNext').dataset.next) };
$('winList').onclick = () => { $('win').hidden = true; openKap(AUFGABEN[cur].k) };
$('bSpeak').onclick = () => { const a = AUFGABEN[cur]; say(a.titel + '. ' + a.text) };
$('bReset').onclick = () => openPuzzle(cur);

// ---------- Partie gegen den Computer ----------
let aiLevel = store.get('aiLevel', 1), aiColor = store.get('aiColor', 'w');
function segSet(id, v) { document.querySelectorAll('#' + id + ' button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v == v)) }
document.querySelectorAll('#segLevel button').forEach(b => b.onclick = () => { aiLevel = +b.dataset.v; store.set('aiLevel', aiLevel); segSet('segLevel', aiLevel) });
document.querySelectorAll('#segColor button').forEach(b => b.onclick = () => { aiColor = b.dataset.v; store.set('aiColor', aiColor); segSet('segColor', aiColor) });
function openSetup() { mode = null; segSet('segLevel', aiLevel); segSet('segColor', aiColor); $('aiResume').hidden = !store.get('aiGame', null); view('vSetup') }
$('goAI').onclick = openSetup;
$('aiStart').onclick = () => startAI(aiColor === 'r' ? (Math.random() < .5 ? 'w' : 'b') : aiColor, aiLevel, null);
$('aiResume').onclick = () => { const g = store.get('aiGame', null); if (g) startAI(g.me, g.level, g.pgn) };
const LVLNAME = { 1: 'Leicht 🐣', 2: 'Mittel 🦊', 3: 'Stark 🦁' };
let aiLvlCur = 1;
function startAI(color, level, pgn) {
  mode = 'ai'; me = color; aiLvlCur = level; game = new Chess(); if (pgn) { try { game.loadPgn(pgn) } catch (e) { game = new Chess() } }
  sel = null; busy = false; over = false; hint = null;
  const h = game.history({ verbose: true }); lastMove = h.length ? [h[h.length - 1].from, h[h.length - 1].to] : null;
  $('playNum').textContent = 'Computer: ' + LVLNAME[level];
  $('tTitle').textContent = 'Partie gegen den Computer'; $('tText').hidden = true;
  $('tDot').style.background = me === 'w' ? '#fff' : '#1D2B53';
  $('puzzleTools').hidden = true; $('aiTools').hidden = false;
  view('vPlay'); aiStatus(); renderBoard(); saveAI();
  if (game.turn() !== me && !game.isGameOver()) aiThink();
}
function moveListText() {
  const h = game.history(); let s = '';
  for (let i = 0; i < h.length; i += 2) s += (i / 2 + 1) + '. ' + h[i] + (h[i + 1] ? ' ' + h[i + 1] : '') + '  ';
  return s.trim().split('  ').slice(-6).join('  ');
}
function aiStatus(extra) {
  $('moveList').textContent = moveListText();
  if (game.isGameOver()) return gameOver();
  const mine = game.turn() === me;
  $('tTurn').textContent = `Du spielst ${me === 'w' ? 'Weiß' : 'Schwarz'}. ` + (mine ? 'Du bist dran!' : 'Der Computer denkt nach …');
  if (extra) setMsg(extra[0], extra[1]);
  else setMsg(mine && game.inCheck() ? 'Achtung, Schach! Rette deinen König.' : '', mine && game.inCheck() ? 'bad' : '');
}
function aiPlayerMove(mv) {
  const res = game.move({ from: mv.from, to: mv.to, promotion: 'q' });
  sel = null; hint = null; lastMove = [res.from, res.to]; renderBoard(); saveAI();
  if (game.isGameOver()) { aiStatus(); return }
  aiStatus(res.captured ? ['Du hast ' + DEN[res.captured] + ' geschlagen! 👍', 'good'] : null);
  aiThink();
}
function aiThink() {
  busy = true; aiStatus();
  setTimeout(() => {
    if (mode !== 'ai') return;
    const san = bestMove(game.fen(), aiLvlCur);
    if (mode !== 'ai' || !san) { busy = false; return }
    const r = game.move(san); lastMove = [r.from, r.to]; busy = false; renderBoard(); saveAI();
    if (r.captured) { aiStatus(['Der Computer hat ' + DEN[r.captured] + ' geschlagen.', 'bad']); if (game.inCheck()) setMsg('Schach! Und der Computer hat ' + DEN[r.captured] + ' geschlagen.', 'bad') }
    else aiStatus();
    if (game.inCheck() && !game.isGameOver()) say('Schach!');
  }, 350);
}
function gameOver() {
  over = true; busy = false; let t, cls = '';
  if (game.isCheckmate()) { const iWon = game.turn() !== me; t = iWon ? 'Schachmatt! Du hast gewonnen! 🎉' : 'Schachmatt. Der Computer hat gewonnen.'; cls = iWon ? 'good' : 'bad';
    if (iWon) { const w = store.get('aiWins', {}); w[aiLvlCur] = (w[aiLvlCur] || 0) + 1; store.set('aiWins', w) } }
  else if (game.isStalemate()) t = 'Patt! Unentschieden.';
  else t = 'Unentschieden.';
  $('tTurn').textContent = 'Partie vorbei.'; setMsg(t, cls); say(t.replace(/🎉/g, ''));
  store.set('aiGame', null);
}
function saveAI() { if (mode === 'ai' && !game.isGameOver()) store.set('aiGame', { me, level: aiLvlCur, pgn: game.pgn() }) }
$('aUndo').onclick = () => {
  if (mode !== 'ai' || busy) return;
  if (game.history().length === 0) return;
  game.undo(); if (game.turn() !== me) game.undo();
  over = false; sel = null; hint = null; const h = game.history({ verbose: true }); lastMove = h.length ? [h[h.length - 1].from, h[h.length - 1].to] : null;
  renderBoard(); aiStatus(['Zug zurückgenommen.', '']); saveAI();
  if (game.turn() !== me) aiThink();
};
$('aNew').onclick = () => { store.set('aiGame', null); openSetup() };
$('aHint').onclick = () => {
  if (!canPlay() || mode !== 'ai') return;
  setMsg('Ich überlege …', '');
  setTimeout(() => {
    const san = bestMove(game.fen(), 2); if (!san) return;
    const c = new Chess(game.fen()), m = c.move(san);
    hint = { from: m.from, to: m.to, lvl: 3 }; renderBoard();
    const t = `Ein guter Zug: ${DEN[m.piece]} von ${m.from} nach ${m.to}.`; setMsg('💡 ' + t, ''); say(t);
  }, 30);
};

$('voiceBtn').onclick = nextVoice;
renderHome();
</script>
</body>
</html>
